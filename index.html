<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cozy Solitaire</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2b3a2e;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 24px;
        background: radial-gradient(circle at 50% 38%, #355746 0%, #203a30 48%, #142b25 100%);
        color: #f3e3c3;
        font-family: Arial, sans-serif;
        text-align: center;
        transition: opacity 350ms ease;
      }
      #loading-screen.is-complete {
        opacity: 0;
        pointer-events: none;
      }
      .loading-content {
        width: min(100%, 340px);
      }
      .loading-cards {
        position: relative;
        width: 104px;
        height: 112px;
        margin: 0 auto 22px;
        animation: loading-float 2.2s ease-in-out infinite;
      }
      .loading-card {
        position: absolute;
        width: 72px;
        height: 96px;
        box-sizing: border-box;
        border-radius: 9px;
        box-shadow: 0 9px 18px #071b1780;
      }
      .loading-card-back {
        left: 8px;
        top: 9px;
        transform: rotate(-16deg);
        border: 3px double #d7be87;
        background: repeating-linear-gradient(45deg, #245b54, #245b54 6px, #1c4844 6px, #1c4844 12px);
      }
      .loading-card-front {
        left: 29px;
        top: 3px;
        display: grid;
        place-items: center;
        transform: rotate(10deg);
        border: 2px solid #e5d8bf;
        background: #fffaf0;
        color: #bd4d45;
        font-size: 48px;
        line-height: 1;
      }
      .loading-title {
        margin: 0;
        color: #f7e9c9;
        font-family: Georgia, serif;
        font-size: clamp(29px, 6vw, 38px);
        letter-spacing: 0.08em;
        line-height: 1.1;
      }
      .loading-subtitle {
        margin: 10px 0 30px;
        color: #cbbd9f;
        font-size: 14px;
      }
      .loading-meter {
        position: relative;
        height: 10px;
        overflow: hidden;
        border: 1px solid #af9871;
        border-radius: 999px;
        background: #102b25;
      }
      .loading-meter::after {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -35%;
        width: 35%;
        background: linear-gradient(90deg, transparent, #e6c991a8, transparent);
        content: '';
        animation: loading-sweep 1.4s ease-in-out infinite;
      }
      #loading-screen.is-tracking .loading-meter::after { display: none; }
      #loading-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #b78b57, #f5d78b);
        transition: width 180ms ease;
      }
      .loading-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
        color: #e5d3af;
        font-size: 13px;
      }
      #loading-percent { visibility: hidden; font-variant-numeric: tabular-nums; }
      #loading-screen.is-tracking #loading-percent { visibility: visible; }
      @keyframes loading-float { 50% { transform: translateY(-7px); } }
      @keyframes loading-sweep { to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        .loading-cards, .loading-meter::after { animation: none; }
        #loading-screen, #loading-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading-screen" role="status" aria-live="polite">
      <div class="loading-content">
        <div class="loading-cards" aria-hidden="true">
          <div class="loading-card loading-card-back"></div>
          <div class="loading-card loading-card-front">♥</div>
        </div>
        <h1 class="loading-title">COZY SOLITAIRE</h1>
        <p class="loading-subtitle">A little moment to unwind</p>
        <div class="loading-meter" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Preparing game">
          <span id="loading-fill"></span>
        </div>
        <div class="loading-meta">
          <span id="loading-status">Preparing your deck…</span>
          <span id="loading-percent" aria-live="off">0%</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
